# Seed config for qBittorrent - copied to appdata/qbittorrent/qBittorrent/qBittorrent.conf by jellyfin.service only if none exists yet,
# so settings changed later in the web UI are never overwritten. Everything not set here uses qBittorrent's defaults.
[BitTorrent]
# half-finished files are named "Movie.mkv.!qB" - nothing mistakes a partial download for a real video
Session\AddExtensionToIncompleteFiles=true
# where Radarr/Sonarr expect downloads (media/downloads on the NFS share, /data/downloads in the containers)
Session\DefaultSavePath=/data/downloads/

[Preferences]
WebUI\Port=8080
# off (as in linuxserver's default config, which this seed replaces): the WebUI is only reachable through SSH tunnels, where the browser's
# port (e.g. localhost:18080) never matches 8080 - with validation on, every request gets a bare "Unauthorized"
WebUI\HostHeaderValidation=false
